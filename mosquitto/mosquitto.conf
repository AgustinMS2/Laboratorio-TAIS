# Eclipse Mosquitto - broker MQTT de la parte 3 del laboratorio.
# Por el tópico ordenes/procesar viajan los mensajes JSON {"id", "estado", "fechaCreacion"}.

listener 1883
allow_anonymous true

# Persistencia: los mensajes QoS 1 destinados a sesiones persistentes (el procesador
# se suscribe con cleanSession=false) sobreviven si el procesador o el broker se reinician.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
