server {
    listen 80;
    server_name _;

    # Resolver DNS interno de docker: nginx arranca aunque los servicios aun no esten arriba
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # El navegador llama a este mismo origen; nginx reenvia a cada microservicio
    location /api/ordenes {
        set $up http://ordenes:5002;
        proxy_pass $up;
    }
    location /api/productos {
        set $up http://productos:5001;
        proxy_pass $up;
    }
    location /api/facturas {
        set $up http://procesamiento:5003;
        proxy_pass $up;
    }
}
